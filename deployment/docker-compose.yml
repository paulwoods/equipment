# sanitized reference copy, last mirrored from the vm 2026-06-10.
# The live file is now ~/caddy/docker-compose.yml on the vm — it runs the
# equipment services alongside other apps (e.g. calculus) and pins newer image
# tags. Re-sync this copy after the equipment-db-user cutover.

name: equipment

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    # No published port. The backend reaches Postgres over the compose network as
    # postgres:5432; publishing to the host loopback would also expose it to every
    # co-tenant process on the vm, which — with the credentials sitting in .env on
    # the same filesystem — is a direct route around the app's authorization.
    # For operator access use: docker compose exec postgres psql -U postgres -d equipment
    volumes:
      - ./postgres-data:/var/lib/postgresql
      # Creates the application role + database on a fresh volume. For an
      # existing volume, run it manually — see RUNBOOK-equipment-db-user.md.
      - ./init-app-db.sh:/docker-entrypoint-initdb.d/init-app-db.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    image: paulwoods/equipment-backend:2.0.46
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    image: paulwoods/equipment-frontend:2.0.38
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
