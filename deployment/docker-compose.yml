name: equipment

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: paulwoods/equipment-backend:latest
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: paulwoods/equipment-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
