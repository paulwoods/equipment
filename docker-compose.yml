services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql
      # Creates the application role + database on a fresh volume. For an
      # existing volume, run it manually — see deployment/RUNBOOK-equipment-db-user.md.
      - ./deployment/init-app-db.sh:/docker-entrypoint-initdb.d/init-app-db.sh:ro
    #    healthcheck:
    #      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
    #      interval: 10s
    #      timeout: 5s
    #      retries: 5
    ports:
      - "5432:5432"
