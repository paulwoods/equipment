services:

  equipment-management:
    image: paulwoods/equipment-management:latest
    expose:
      - "3000"
    environment:
      - APP_DATA_DIR=data
    volumes:
      - ./data:/app/data
    restart: always

  # nginx reverse proxy: listens on 80 (redirect) and 443 (TLS + proxy to app)
  # Before first `docker-compose up`, obtain the initial cert:
  #   docker-compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d equipment.example.com --email you@example.com --agree-tos --no-eff-email
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - equipment-management
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: always
