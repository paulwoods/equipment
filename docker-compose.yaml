services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - equipment-management
    restart: always

  equipment-management:
    image: paulwoods/equipment-management:latest
    expose:
      - "3000"
    environment:
      - APP_DATA_DIR=data
    volumes:
      - ./data:/app/data
    restart: always

volumes:
  caddy_data:
  caddy_config:
