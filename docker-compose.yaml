services:

  equipment-management:
    image: paulwoods/equipment-management:latest
    expose:
      - "3000"
    environment:
      - APP_DATA_DIR=data
    volumes:
      - ./data:/app/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - equipment-management
    restart: always
